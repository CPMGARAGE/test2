<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon - TerminalTanks</title>
<meta name="description" content="What is being added to TerminalTanks next.">
<meta name="theme-color" content="#05090f">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="soon">
<main data-title="INCOMING" data-chip="IN DEVELOPMENT">
  <h2>WHAT IS NEXT</h2>
  <p class="lead">The next additions to TerminalTanks, in the order they are likely to land.</p>
  <div id="list"></div>
  <p class="muted">Dates are not promised. New releases are announced on <a href="https://github.com/ethanlabs101/TerminalTanks" target="_blank" rel="noopener">GitHub</a>.</p>
</main>
<script src="site.js"></script>
<script>
/* Edit this list to change the page. status: "Building", "Designing" or "Planned". */
const NEXT = [
  { name: 'More Tournament levels', status: 'Building', text: 'A longer climb past the Master\u2019s Citadel, with new bosses, tanks and shells to earn along the way.' },
  { name: 'New battlefields', status: 'Designing', text: 'More special maps with their own terrain rules, each tied to a mission or Tournament reward.' },
  { name: 'More home screens', status: 'Designing', text: 'New themes for the title screen, unlocked through play like the existing ones.' },
  { name: 'Match replays', status: 'Planned', text: 'Save a finished match and watch it back, shot by shot, with the wind of each turn shown.' },
];
document.getElementById('list').innerHTML = NEXT.map((n) => `<div class="soon"><h3>${n.name}</h3><div class="${n.status === 'Building' ? 'warn' : 'muted'}">${n.status}</div><p>${n.text}</p></div>`).join('');
</script>
</body>
</html>
